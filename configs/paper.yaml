# Experiment plan for the paper, executed by scripts/run_paper.py (resumable, skips finished steps).
# Every step is a normal script call; the runner only adds names, seeds and paths between stages.
# All checkpoints from the thesis are invalid here: they were trained on splits that contained the
# classification test patients. Everything below is retrained on data/splits/splits_seed42.json.

# Applied to every step. Put your data paths here (or pass them with --set on the command line).
overrides:
  - data.image_dir=data/raw/UCSF-PDGM
  - data.label_dir=null
  - data.metadata_csv=data/metadata/UCSF-PDGM-metadata_v5.csv
  - data.cohort_csv=data/metadata/balanced_metadata_gradeaware.csv
  - output_root=runs/paper

# Delete each run's last.pt (weights + optimizer state) once the run has finished; only best.pt is
# used afterwards. Keeps total Drive usage at roughly 3-4 GB instead of ~12 GB.
keep_last_checkpoints: false

splits:
  config: configs/base.yaml

ssl:
  config: configs/ssl.yaml
  overrides: [train.epochs=50]          # ~13 min/epoch on a T4 at batch 2 (thesis log)

segmentation:
  seeds: [42]                           # add 43, 44 if compute allows (report mean ± SD over seeds)
  overrides: [train.epochs=100, train.val_every=5]   # identical budget for every model
  models:
    seg_swin_unetr: {config: configs/seg_swin_unetr.yaml}
    seg_swin_unetr_ssl: {config: configs/seg_swin_unetr_ssl.yaml, needs_ssl: true}
    seg_segresnet: {config: configs/seg_segresnet.yaml}
    seg_unet: {config: configs/seg_unet.yaml}                    # 3D residual U-Net, wider (32-320)
    seg_unet_thesis: {config: configs/seg_unet_thesis.yaml}      # same 3D U-Net with the thesis config (16-256)
    # Needs the CUDA build from the notebook's SegMamba cell. Optional, so a broken build cannot block the rest.
    seg_segmamba: {config: configs/seg_segmamba.yaml, optional: true}
    # Sensitivity run added after the main results (thesis lr 5e-5). Its own row, labelled; never the
    # reference "best" model of the Wilcoxon comparison. Not optional: it is the classification backbone.
    seg_segmamba_lr5e5: {config: configs/seg_segmamba_lr5e5.yaml, sensitivity: true}

classification:
  # Segmentation run (first seed) used as backbone + mask predictor. SegMamba, as in the thesis; switched
  # from seg_swin_unetr_ssl after the segmentation results (see docs/paper_protocol.md). The classifier
  # configs' model.backbone (configs/cls_mask_guided.yaml) must be the same architecture.
  backbone: seg_segmamba_lr5e5
  feature_config: configs/cls_mask_guided.yaml   # data/model settings for deep-feature + radiomics extraction
  # One seed first. Later change to [42, 43, 44]: finished runs are skipped, only the new seeds train,
  # and the tables switch to mean ± SD over seeds.
  seeds: [42]
  overrides: [train.epochs=100]
  # Every experiment also reports LGG vs HGG (from its grade head, or a dedicated head for cls_segmamba).
  # Per experiment: `use_radiomics`, `backbone` (a segmentation model key) and `seeds` override the defaults.
  # The experiment key is the run / table name, so the main ladder reads as the paper's comparison.
  experiments:
    # main comparison: the same model, only the inputs change ("clinical" = age, sex, biopsy before MRI)
    cls_image_only: {config: configs/cls_image_only.yaml}
    cls_image_clinical: {config: configs/cls_mask_guided.yaml}
    cls_image_clinical_radiomics: {config: configs/cls_image_clinical_radiomics.yaml, use_radiomics: true}
    # reference only: the thesis clinical vector (IDH, 1p/19q, MGMT, EOR = post-operative, leaky), same two rungs
    cls_leaky_reference: {config: configs/cls_leaky_reference.yaml, reference: true}
    cls_leaky_reference_radiomics: {config: configs/cls_leaky_reference_radiomics.yaml, use_radiomics: true, reference: true}
    # corrected thesis architecture variants (image + clinical, + radiomics where the thesis had it)
    cls_cascade: {config: configs/cls_cascade.yaml}                      # frozen encoder, concat fusion
    cls_multiscale: {config: configs/cls_multiscale.yaml}                # stages 2-4 + decoder
    cls_trinity: {config: configs/cls_trinity.yaml, use_radiomics: true} # cross-attention, stages 1-3, SupCon
    cls_segmamba: {config: configs/cls_segmamba.yaml, use_radiomics: true}  # peritumoral ring, hard mask

kfold:                                  # XGBoost / logistic regression / RF / MLP late fusion, repeated k-fold
  config: configs/kfold_cv.yaml
  use_deep_features: true
  use_radiomics: true
  holdout: true
  learning_curve: true                  # AUC against training-set size (kfold_cv.yaml: learning_curve), CPU
  split_gap: true                       # fit on train, predict val + test, for the validation-test gap test, CPU
  negative_control: true                # shuffled labels, feature steps inside against before the folds, CPU
