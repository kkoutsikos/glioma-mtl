inherit: cls_mask_guided.yaml
name: cls_segmamba

# Thesis "AdvancedMaskGuidedModel_v3_Mamba": SegMamba backbone (the shared one, inherited from
# cls_mask_guided.yaml), its 768-channel bottleneck pooled inside the binary tumour (core) and in a ring
# around it (peritumoral), fused with clinical + radiomics tokens; heads for 3-way grade, LGG vs HGG and diagnosis.
# Fixes vs the thesis: per-sample masked mean (the thesis divided by the whole batch's tumour volume).
# Needs the CUDA SegMamba build (notebook cell); the runner sets backbone_checkpoint and radiomics.csv.
tasks: [grade, diagnosis, lgg_hgg]

model:
  encoder_stages: [4]
  use_decoder_token: false
  mask_mode: hard
  peritumoral: true
  peritumoral_dilation: 5
  modality_dropout: 0.4

loss:
  task_weights: {grade: 1.0, diagnosis: 0.5, lgg_hgg: 0.5}

radiomics:
  k: 30
  select_task: grade
