inherit: base.yaml
name: cls_mask_guided

# The paper's "image + clinical" model, and the base every other classifier config inherits from.
# Ladder: cls_image_only (clinical.groups: []) -> this -> cls_image_clinical_radiomics (+ radiomics token).
tasks: [grade, diagnosis]          # any of: grade, diagnosis, idh, lgg_hgg

# "Clinical" = everything known before surgery: age, sex, and whether a biopsy preceded the MRI.
# Groups: demographics (Age, Sex) | history (biopsy before imaging) | molecular (IDH, 1p/19q, MGMT) | surgical (EOR).
# molecular / surgical come from tissue or surgery and define the WHO-2021 labels: leaky reference only.
clinical:
  groups: [demographics, history]
  allow_leakage: false

radiomics:
  csv: null                        # output of scripts/extract_radiomics.py
  k: 30                            # features kept, chosen on the training split only
  select: rfe                      # rfe (random forest, as in the thesis) | anova (univariate F-test)
  select_task: grade

data:
  num_samples: 2
  crop:
    pos: 1.0                       # tumour-centred training crops (thesis: pos=1, neg=1 -> half background)
    neg: 0.0
  crop_mask_key: label             # eval crop centre: label = oracle GT mask | pred_mask = predicted mask
  pred_mask_dir: null              # set when crop_mask_key=pred_mask (scripts/evaluate_segmentation.py --save-predictions)
  model_mask_key: label            # mask passed to the model when model.mask_mode=input

model:
  in_channels: 1
  # Encoder of the shared segmentation backbone (configs/paper.yaml: classification.backbone). SegMamba
  # needs the CUDA build from the notebook's SegMamba cell. For a SwinUNETR backbone set
  # backbone: swin_unetr (feature_size / use_checkpoint below then apply).
  backbone: segmamba
  backbone_cfg:                    # must match configs/seg_segmamba.yaml
    segmamba_repo: third_party/SegMamba
    depths: [2, 2, 2, 2]
    feat_size: [48, 96, 192, 384]
    hidden_size: 768
  feature_size: 48
  use_checkpoint: true
  backbone_checkpoint: runs/seg_segmamba_lr5e5_s42/best.pt   # segmentation model trained on the shared split
  freeze_backbone: false
  encoder_stages: [4]              # 0..4; [2, 3, 4] = thesis multi-scale variant
  use_decoder_token: true
  mask_mode: soft                  # soft | hard | input | none
  fusion: transformer              # transformer | cross_attention | concat
  d_model: 128
  n_heads: 4
  num_layers: 2
  dropout: 0.3
  modality_dropout: 0.3
  aux_heads: true

loss:
  kind: focal                      # focal | ce
  gamma: 2.0
  task_weights: {grade: 1.0, diagnosis: 0.5}
  seg_weight: 1.0                  # keep the segmentation head trained while fine-tuning
  aux_weight: 0.3
  supcon_weight: 0.0

train:
  epochs: 100
  lr: 2.0e-4                       # heads
  lr_backbone: 1.0e-5
  weight_decay: 0.05
  warmup_epochs: 5
  freeze_backbone_epochs: 10       # heads only first, then fine-tune everything (no effect if freeze_backbone)
  accumulation: 8
  amp: true

selection:
  # cls_nll = task-weighted NLL of the classification heads only, identical for every model. val_loss would
  # also include the segmentation, auxiliary and contrastive terms (which differ between models).
  metric: cls_nll                  # cls_nll | val_loss | mean_macro_f1 | grade_macro_f1 | ...
  ema: 0.6                         # smooth the noisy 25-patient validation curve before picking a checkpoint
  patience: 25

inference:
  tta_flips: true                  # validation and test: average the probabilities over the 8 flips of the crop
