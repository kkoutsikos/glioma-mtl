inherit: base.yaml
name: kfold_cv

tasks: [grade, diagnosis, idh, lgg_hgg]

# Same "clinical" as the deep classifiers (configs/cls_mask_guided.yaml): everything known before surgery.
# Feature sets mirror the ladder: image -> image+clinical -> image+clinical+radiomics ("image" = label-free
# deep features from the segmentation backbone), plus age+sex / clinical / radiomics baselines and leaky references.
clinical:
  groups: [demographics, history]

radiomics:
  csv: null          # runs/radiomics/radiomics_pred.csv (predicted masks) or radiomics_label.csv (oracle)
  k: 30              # features kept, chosen per training fold
  select: rfe        # rfe (random forest, as in the thesis) | anova (univariate F-test)
deep_features:
  csv: null          # runs/deep_features/deep_features_pred.csv (scripts/extract_deep_features.py)
  k: 32              # ANOVA top-k per training fold (raw dim = 192 + 384 + 768 + 48)

cv:
  folds: 5
  repeats: 10
  models: [logreg, random_forest, mlp, xgboost]   # 'majority' is always included as a floor
  mlp_hidden: [64]
  mlp_alpha: 0.01
  feature_sets: null                         # null = all available, see scripts/kfold_cv.py
  logreg_C: 0.5
  xgboost: {n_estimators: 200, max_depth: 4, learning_rate: 0.05}
# scripts/kfold_cv.py --learning-curve: macro AUC against the number of training patients. Each training fold is
# subsampled (stratified) to these fractions; the test folds stay whole and are the same for every feature set.
learning_curve:
  fractions: [0.25, 0.5, 0.75, 1.0]
  repeats: 4                                 # x cv.folds = 20 test folds
  models: [xgboost, logreg]
  feature_sets: [age+sex, radiomics, image, clinical+radiomics, image+clinical+radiomics]
# scripts/kfold_cv.py --split-gap: fit on the classification training patients, predict validation and test, so that
# late fusion can sit next to the end-to-end models in the validation-test gap test (scripts/aggregate_results.py).
split_gap:
  models: [xgboost, logreg]
  feature_sets: [age+sex, radiomics, image, image+clinical, clinical+radiomics, image+clinical+radiomics]
# scripts/kfold_cv.py --negative-control: shuffled labels must score AUC 0.5 unless information leaks. Feature steps
# fit inside the folds (this study) against once before them (the common mistake); the real labels use the main folds.
negative_control:
  permutations: 100
  tasks: [diagnosis, lgg_hgg, idh]
  models: [xgboost, logreg]
  feature_sets: [radiomics, image]           # 102 features -> RFE top 30; 1392 features -> ANOVA top 32
